name: Deploy to Nekoweb
description: Deploy to Nekoweb using the Nekoweb API
author: fairfruit
inputs:
  API_KEY:
    description: API key for Nekoweb
    required: true
  BUILD_DIR:
    description: Local build directory to deploy
    required: true
  DEPLOY_DIR:
    description: Remote directory to deploy to
    required: true
    default: /
  NEKOWEB_PAGENAME:
    description: Your NekoWeb page name (your username unless you use a custom domain).
    required: true
  CLEANUP:
    description: Also delete remote files that don't exist locally
    default: "False"
  DELAY:
    description: Delay between Nekoweb API requests (in seconds)
    required: false
    default: "0.5"
  RETRY_ATTEMPTS:
    description: Number of times to retry the Nekoweb API request
    required: false
  RETRY_DELAY:
    description: Delay between Nekoweb API request retries (in seconds) when rate limited
    required: false
  RETRY_EXP_BACKOFF:
    description: Exponential backoff for Nekoweb API request retries
    required: false
  ENCRYPTION_KEY:
    description: A secret key used to encrypt the file states. Must be a 32-byte raw key string
    required: false
  DEBUG:
    description: Enable debug mode
    required: false
branding:
  icon: upload-cloud
  color: blue
runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: python -m pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - name: Deploy to Nekoweb
      run: |
        ARGS=(
          "${{ github.action_path }}/deploy.py"
          "${{ inputs.API_KEY }}"
          "${{ inputs.BUILD_DIR }}"
          "${{ inputs.DEPLOY_DIR }}"
          "${{ inputs.CLEANUP }}"
          "${{ inputs.NEKOWEB_PAGENAME }}"
        )
        [[ -n "${{ inputs.DELAY }}" ]]          && ARGS+=(--delay "${{ inputs.DELAY }}")
        [[ -n "${{ inputs.ENCRYPTION_KEY }}" ]] && ARGS+=(--encryption-key "${{ inputs.ENCRYPTION_KEY }}")
        [[ -n "${{ inputs.RETRY_ATTEMPTS }}" ]] && ARGS+=(--retry-attempts "${{ inputs.RETRY_ATTEMPTS }}")
        [[ -n "${{ inputs.RETRY_DELAY }}" ]]    && ARGS+=(--retry-delay "${{ inputs.RETRY_DELAY }}")
        RETRY_EXP_BACKOFF_INPUT="${{ inputs.RETRY_EXP_BACKOFF }}"
        [[ "${RETRY_EXP_BACKOFF_INPUT,,}" == "true" ]] && ARGS+=(--retry-exp-backoff)
        DEBUG_INPUT="${{ inputs.DEBUG }}"
        [[ "${DEBUG_INPUT,,}" == "true" ]] && ARGS+=(--debug)
        python "${ARGS[@]}"
      shell: bash
